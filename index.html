
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .error-container {
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-size: 150px;
            font-weight: 700;
            line-height: 1.1;
            color: #333333;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #333333;
        }

        p {
            font-size: 14px;
            color: #444444;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 100px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Not Found</h2>
        <p>The resource requested could not be found on this server!</p>
    </div>
</body>
</html>
